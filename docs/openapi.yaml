openapi: 3.1.0
info:
  title: CDP Lite API
  version: 1.0.0
  description: 本地受控演示管理员模式，无公网鉴权。只保存规则，不执行人群计算。时间统一 UTC ISO 8601。400 格式错误；404
    不存在；409 引用、编码、revision 冲突；422 语义校验失败；500 内部错误。
servers:
  - url: http://localhost:3000/api/v1
    description: 本地开发
paths:
  /metadata:
    parameters: []
    get:
      summary: 标签 / 属性列表
      tags:
        - 标签 / 属性
      parameters:
        - &a2
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - &a3
          name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - &a4
          name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - &a5
          name: status
          in: query
          schema:
            type: string
            enum:
              - ENABLED
              - DISABLED
              - DRAFT
              - CONFIGURED
        - &a6
          name: sortBy
          in: query
          schema:
            type: string
            enum:
              - name
              - createdAt
              - updatedAt
            default: updatedAt
        - &a7
          name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
        - name: type
          in: query
          schema:
            type: string
            enum:
              - TAG
              - ATTRIBUTE
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Metadata"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default: &a1
          $ref: "#/components/responses/Error"
    post:
      summary: 创建标签 / 属性
      tags:
        - 标签 / 属性
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataInput"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Metadata"
        default: *a1
  /metadata/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 标签 / 属性详情
      tags:
        - 标签 / 属性
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Metadata"
        default: *a1
    patch:
      summary: 部分更新标签 / 属性
      tags:
        - 标签 / 属性
      description: 编码、数据类型、枚举开关、所属父级不可改变；人群更新必须携带当前 revision。枚举值编码仅在未被引用时可修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataPatch"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Metadata"
        default: *a1
    delete:
      summary: 删除标签 / 属性
      tags:
        - 标签 / 属性
      description: 被引用资源返回 409；删除未引用父级时事务内删除其子资源。
      responses:
        "204":
          description: 删除成功，无响应体
        default: *a1
