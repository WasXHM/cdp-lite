components:
  schemas:
    MetadataInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          default: ""
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          default: ENABLED
        fieldName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
        dataType:
          type: string
          enum:
            - String
            - Number
            - Boolean
            - Date
            - DateTime
        displayType:
          type: string
          enum:
            - TEXT
            - NUMBER
            - SELECT
            - MULTI_SELECT
            - BOOLEAN
            - DATE
            - DATETIME
        isEnum:
          type: boolean
          default: false
        metadataType:
          type: string
          enum:
            - TAG
            - ATTRIBUTE
      required:
        - name
        - fieldName
        - dataType
        - displayType
        - metadataType
      additionalProperties: false
    MetadataPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          default: ""
        status:
          type: string
          enum:
            - ENABLED
            - DISABLED
          default: ENABLED
        fieldName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
        dataType:
          type: string
          enum:
            - String
            - Number
            - Boolean
            - Date
            - DateTime
        displayType:
          type: string
          enum:
            - TEXT
