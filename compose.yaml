services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${CDP_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: cdp_lite
      MYSQL_USER: cdp_lite
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  mysql-test:
    profiles: ["test"]
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: cdp_lite_test
      MYSQL_USER: cdp_lite
      MYSQL_PASSWORD: change_me
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
